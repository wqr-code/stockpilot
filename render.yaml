services:
  - type: web
    name: stockpilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn demo.web:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: STOCKPILOT_AUTH
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: stockpilot-db
          property: connectionString

databases:
  - name: stockpilot-db
    plan: free
    databaseName: stockpilot
    user: stockpilot
